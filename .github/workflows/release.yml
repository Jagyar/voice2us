name: Release

# Релиз создаётся при пуше тега вида v1.0.0:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: Build .dmg
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh mac
      - run: mv dist/Voice2Us.dmg "dist/Voice2Us-${GITHUB_REF_NAME}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build .exe
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh win
      - run: mv dist/Voice2Us.exe "dist/Voice2Us-${GITHUB_REF_NAME}-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice2Us ${{ github.ref_name }}
          generate_release_notes: true
          # теги вида v2.0.0-rc.1 публикуются как предварительные релизы
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
